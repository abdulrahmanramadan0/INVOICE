button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:0 0 248px;background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;transition:width .2s}
.sidebar.collapsed{width:72px;flex-basis:72px}
.sidebar.collapsed .lbl,.sidebar.collapsed .brand-txt{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.logo-tile{width:44px;height:44px;border-radius:10px;background:#F3F0E8;display:grid;place-items:center;flex:0 0 44px}
.logo-tile img{width:30px;height:auto;display:block}
.brand-txt b{display:block;font-size:15px;letter-spacing:.2px}
.brand-txt span{font-size:12px;color:var(--muted)}
.nav a,.nav button.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--muted);background:none;border:0;cursor:pointer;text-align:start;position:relative}
.nav a:hover,.nav button.navbtn:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--navy);color:#fff}
.nav a.active::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:3px;background:var(--gold);border-radius:3px}
.nav svg{width:20px;height:20px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sidebar .spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.content{padding:28px clamp(16px,3vw,40px);max-width:1280px;width:100%;margin:0 auto;flex:1}
.footer{padding:18px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.footer a{color:var(--gold);text-decoration:none}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat .k{color:var(--muted);font-size:13px}
.stat .v{font-size:26px;font-weight:600;margin-top:4px;direction:ltr;text-align:start;unicode-bidi:plaintext}
.stat .v small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;min-height:40px;border-radius:10px;border:1px solid var(--navy-3);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none;font-weight:500;transition:background .15s}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14110A}
.btn.gold:hover{filter:brightness(1.07)}
.btn.danger{background:transparent;border-color:#5b2a30;color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
textarea{min-height:76px;resize:vertical}
input[type=file]{padding:8px}
.field{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:13px;background:var(--surface-2)}
tr:hover td{background:rgba(255,255,255,.015)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.num{direction:ltr;unicode-bidi:plaintext;text-align:start;white-space:nowrap}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:#24523f}.badge.warn{color:var(--warn);border-color:#5a4a1e}.badge.bad{color:var(--bad);border-color:#5b2a30}.badge.navy{color:#BFD0F5;border-color:var(--navy-3);background:var(--navy)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.tile .img{aspect-ratio:4/3;background:#0d0f14;cursor:zoom-in}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{padding:12px;display:flex;flex-direction:column;gap:4px}
.tile .t{font-weight:600}
.muted{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:38px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;display:block;cursor:zoom-in;background:#0d0f14}
.chart{width:100%;height:220px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:100;padding:16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
.modal.wide{width:min(960px,100%)}
.modal h2{margin-bottom:16px}
.modal .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin:0 0 10px}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.bad{border-color:#5b2a30}
.lightbox img{max-width:100%;max-height:86vh;display:block;margin:auto;border-radius:8px}
.group-h{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.notice{background:var(--surface-2);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:16px}

/* ---------- Invoice sheet (A4) ---------- */
.sheet-wrap{background:#2a2f3a;padding:20px;border-radius:var(--radius);overflow:hidden;display:flex;justify-content:center}
.sheet{background:#fff;color:#14171F;width:210mm;flex:0 0 210mm;min-height:297mm;margin:0;padding:14mm 14mm 12mm;position:relative;font-size:12.5px;line-height:1.55}
.sheet *{color:inherit}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:12px;border-bottom:3px solid var(--navy)}
.sh-brand{display:flex;gap:12px;align-items:center}
.sh-brand img{width:64px;height:auto;display:block}
.sh-brand b{font-size:19px;color:var(--navy);display:block}
.sh-brand span{color:#555C6B;font-size:12px}
.sh-title{text-align:end}
.sh-title .big{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:.5px}
.sh-title .en{font-size:11px;letter-spacing:3px;color:#8A90A0}
.sh-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.sh-box{background:#F5F6F9;border-radius:8px;padding:10px 14px}
.sh-box h4{margin:0 0 4px;font-size:11px;color:#6B7285;font-weight:500;letter-spacing:.4px}
.sh-box div{font-size:13px}
.sh-table{width:100%;border-collapse:collapse;margin-top:6px}
.sh-table th{background:var(--navy);color:#fff!important;font-weight:500;font-size:11.5px;padding:8px 10px;border:0}
.sh-table th *{color:#fff}
.sh-table td{padding:9px 10px;border-bottom:1px solid #E3E6EC;vertical-align:middle;background:#fff}
.sh-table tr{break-inside:avoid;page-break-inside:avoid}
.sh-table thead{display:table-header-group}
.sh-table img{width:34mm;max-height:26mm;object-fit:contain;display:block;background:#F5F6F9;border-radius:4px}
.sh-table .t{font-weight:600}
.sh-table .d{color:#666D7E;font-size:11.5px}
.sh-totals{margin-top:14px;margin-inline-start:auto;width:78mm;break-inside:avoid;page-break-inside:avoid}
.sh-totals div.r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #E3E6EC}
.sh-totals div.final{background:var(--navy);color:#fff;border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.sh-totals div.final *{color:#fff}
.sh-note{margin-top:14px;font-size:12px;color:#3B4152;break-inside:avoid}
.sh-note h4{margin:0 0 2px;font-size:11px;color:#6B7285}
.sh-foot{margin-top:18px;padding-top:10px;border-top:1px solid #E3E6EC;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#6B7285;break-inside:avoid}
.sh-foot a{color:var(--navy);text-decoration:none}
.sh-stamp{display:inline-block;padding:2px 12px;border:1.5px solid;border-radius:6px;font-weight:600;font-size:12px}
.sh-table thead tr.runrow{display:none}
.mobile-only{display:none}
.bnav,.scrim{display:none}
button,a,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

@media (max-width:900px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transform:translateX(100%);width:280px;flex-basis:auto;transition:transform .22s ease;box-shadow:-10px 0 40px rgba(0,0,0,.5);overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top))}
  .sidebar.open{transform:none}
  .sidebar.collapsed{width:280px}
  .sidebar.collapsed .lbl,.sidebar.collapsed .brand-txt{display:initial}
  .sidebar.open ~ .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  .nav a{padding:14px 12px;font-size:16px}
  .topbar{display:flex;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar b{font-size:16px}
  .main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .content{padding:18px 14px}
  h1{font-size:21px}
  .sub{margin-bottom:16px}
  .two{grid-template-columns:1fr}
  .hide-m{display:none}
  input,select,textarea{font-size:16px;min-height:46px}
  .btn{min-height:46px}
  .btn.sm{min-height:40px;padding:6px 14px}
  .page-head{align-items:stretch}
  .page-head>.row{width:100%}
  .page-head>.row .btn{flex:1}
  .row>select,.row>input{flex:1 1 44%;width:auto!important;min-width:0;max-width:none!important}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qa .btn.gold,.qa .btn:last-child{grid-column:1/-1}
  .tb{display:grid!important;grid-template-columns:1fr 1fr;width:100%}
  .tb .btn:first-child{grid-column:1/-1}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:14px}
  .stat .v{font-size:20px}
  .stat .k{font-size:12px}
  .gallery{grid-template-columns:1fr 1fr;gap:10px}
  .tile .meta{padding:10px}
  /* tables become stacked cards */
  .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td,table.rt,table.rt tbody,table.rt tr,table.rt td{display:block}
  .table-wrap thead,table.rt thead{display:none}
  .table-wrap tr,table.rt tr{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
  .table-wrap tr:last-child,table.rt tr:last-child{border-bottom:0}
  .table-wrap td,table.rt td{padding:0;border:0}
  .table-wrap td.hide-m{display:block}
  .table-wrap td[data-l]::before,table.rt td[data-l]::before{content:attr(data-l) ': ';color:var(--muted);font-size:12px}
  .table-wrap td:last-child,table.rt td:last-child{margin-inline-start:auto}
  .table-wrap tr:hover td{background:none}
  /* bottom sheet modals */
  .overlay{align-items:end;padding:0}
  .modal,.modal.wide{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
  .modal .actions{position:sticky;bottom:-14px;background:var(--surface);padding:10px 0 4px;margin-top:4px}
  .modal .actions .btn{flex:1}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom));inset-inline:14px;text-align:center}
  .sheet-wrap{padding:8px;border-radius:10px}
  .footer{padding:14px;font-size:12px}
  /* bottom navigation */
  .bnav{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;background:rgba(17,20,27,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));align-items:flex-end}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted);text-decoration:none;min-height:50px;justify-content:center}
  .bnav a.on{color:var(--gold)}
  .bnav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bnav .fab{flex:0 0 58px;height:58px;width:58px;margin:-26px 4px 0;border-radius:50%;border:4px solid var(--bg);background:var(--gold);color:#14110A;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)}
}
@media (max-width:380px){.g4{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}}

@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff}
  .sidebar,.topbar,.footer,.no-print,.toast,.overlay{display:none!important}
  .app,.main,.content{display:block!important;padding:0!important;max-width:none!important;min-height:0!important;height:auto!important}
  .sheet-wrap{background:none;padding:0;overflow:visible}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .sh-table thead tr.runrow{display:table-row}
  .sh-table thead tr.runrow th{background:#fff;color:#6B7285!important;font-size:10px;text-align:start;padding:0 0 4px;border-bottom:1px solid #E3E6EC}
  .sheet-wrap{display:block!important;overflow:visible!important}
  .sheet{transform:none!important;margin:0!important;flex:none!important}
  .bnav,.scrim{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

var CUR = { USD:{s:'$',d:2,n:'دولار أمريكي'}, TRY:{s:'₺',d:2,n:'ليرة تركية'}, SYP:{s:'ل.س',d:0,n:'ليرة سورية'} };
function toMinor(v,c){ var n=Number(v); if(!isFinite(n)) throw new Error('قيمة غير صالحة'); return Math.round(n*Math.pow(10,CUR[c].d)); }
function fromMinor(m,c){ return m/Math.pow(10,CUR[c].d); }
function fmt(m,c){ var d=CUR[c].d; var n=fromMinor(m,c).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return n+' '+CUR[c].s; }
function sum(a){ return a.reduce(function(x,y){return x+y;},0); }
function invoiceTotals(prices,adj){ var sub=sum(prices); var total=sub+adj; if(total<0) throw new Error('الخصم أكبر من المجموع'); return {count:prices.length,subtotal:sub,adjustment:adj,total:total,average:prices.length?Math.round(sub/prices.length):0}; }
function payStatus(total,paid){ var rem=Math.max(total-paid,0); return {status: paid<=0?'unpaid':(paid>=total?'paid':'partial'), remaining:rem}; }

function pad(n){return (n<10?'0':'')+n;}
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(s){ if(!s) return ''; var p=s.split('-'); return parseInt(p[2],10)+' '+MONTHS[parseInt(p[1],10)-1]+' '+p[0]; }
function ym(s){ return {y:parseInt(s.slice(0,4),10), m:parseInt(s.slice(5,7),10)}; }
function monthLabel(y,m){ return MONTHS[m-1]+' '+y; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

/* ---------- Storage (IndexedDB) ---------- */
var idb=null;
function idbOpen(){ return new Promise(function(res,rej){ if(typeof indexedDB==='undefined') return rej(new Error('no idb'));
  var r=indexedDB.open('abdulrahman-visuals',1);
  r.onupgradeneeded=function(){ var db=r.result; db.createObjectStore('kv'); db.createObjectStore('img'); };
  r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
function idbGet(store,key){ return new Promise(function(res,rej){ var q=idb.transaction(store).objectStore(store).get(key); q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);}; }); }
function idbAll(store){ return new Promise(function(res,rej){ var out={}; var q=idb.transaction(store).objectStore(store).openCursor(); q.onsuccess=function(){ var c=q.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; q.onerror=function(){rej(q.error);}; }); }
function idbPut(store,key,val){ return new Promise(function(res,rej){ var tx=idb.transaction(store,'readwrite'); tx.objectStore(store).put(val,key); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }
function idbDel(store,key){ return new Promise(function(res,rej){ var tx=idb.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }

/* ---------- Domain helpers ---------- */
function clientById(id){ return S.clients.filter(function(c){return c.id===id;})[0]; }
function designById(id){ return S.designs.filter(function(c){return c.id===id;})[0]; }
function invById(id){ return S.invoices.filter(function(c){return c.id===id;})[0]; }
function invPaid(inv){ return sum(S.payments.filter(function(p){return p.invoiceId===inv.id;}).map(function(p){return p.amount;})); }
function invInfo(inv){
  if(inv.state==='void') return {label:'ملغاة',cls:'bad',remaining:0,paid:invPaid(inv),status:'void'};
  if(inv.state==='draft') return {label:'مسودة',cls:'navy',remaining:inv.total,paid:0,status:'draft'};
  var paid=invPaid(inv), ps=payStatus(inv.total,paid);
  var map={unpaid:['غير مدفوعة','bad'],partial:['مدفوعة جزئياً','warn'],paid:['مدفوعة','ok']};
  return {label:map[ps.status][0],cls:map[ps.status][1],remaining:ps.remaining,paid:paid,status:ps.status};
}
function invoicedDesignIds(){ var set={}; S.invoices.forEach(function(i){ if(i.state!=='void') i.items.forEach(function(it){ if(it.designId) set[it.designId]=i.id; }); }); return set; }
function eligibleDesigns(clientId,y,m,currency,ignoreInvoiceId){
  var used=invoicedDesignIds();
  return S.designs.filter(function(d){ var t=ym(d.date); var u=used[d.id];
    return d.clientId===clientId && t.y===y && t.m===m && d.currency===currency && (!u || u===ignoreInvoiceId); })
    .sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
}
function itemsFromDesigns(ds){ return ds.map(function(d){ return {designId:d.id,title:d.title,description:d.description||'',date:d.date,price:d.price,imageId:d.imageId,slides:d.slides||0,slidePrice:d.slidePrice||0}; }); }
function nextInvoiceNumber(y,m){ var n=S.settings.seq++; return S.settings.prefix+'-'+y+pad(m)+'-'+('00'+n).slice(-3); }
function clientSnap(c){ return {name:c.name,contact:c.contact||'',email:c.email||'',phone:c.phone||''}; }
function buildInvoice(clientId,y,m,currency,adj,notes,replaces,designIds){
  var c=clientById(clientId); var ds=eligibleDesigns(clientId,y,m,currency);
  if(designIds) ds=ds.filter(function(d){return designIds.indexOf(d.id)>=0;});
  if(!ds.length) throw new Error('لا توجد تصاميم غير مفوترة لهذا العميل في '+monthLabel(y,m)+' بعملة '+currency);
  var items=itemsFromDesigns(ds); var t=invoiceTotals(items.map(function(i){return i.price;}),adj);
  return {id:uid(),number:nextInvoiceNumber(y,m),state:'draft',clientId:clientId,year:y,month:m,issueDate:today(),currency:currency,items:items,
    adjustment:adj,subtotal:t.subtotal,total:t.total,notes:notes||S.settings.notes||'',payInstr:S.settings.payInstr||'',closing:S.settings.closing||'',
    clientSnap:clientSnap(c),replaces:replaces||null,createdAt:new Date().toISOString()};
}
function catPrice(name,currency){ var c=S.settings.categories.filter(function(x){return x.name===name&&x.currency===currency;})[0]; return c?c.price:null; }
function defaultPriceFor(clientId,cat,currency){ var c=clientById(clientId); var p=cat?catPrice(cat,currency):null; if(p!=null) return p; if(c&&c.currency===currency) return c.defaultPrice; return 0; }
function byCurrency(rows){ var o={}; rows.forEach(function(r){ o[r.c]=(o[r.c]||0)+r.a; }); return o; }
function multiMoney(o){ var k=Object.keys(o); if(!k.length) return '<span class="num">0</span>'; return k.map(function(c){return '<div class="num">'+esc(fmt(o[c],c))+'</div>';}).join(''); }

/* ---------- Image processing ---------- */
function loadImage(file){ return new Promise(function(res,rej){ var url=URL.createObjectURL(file); var im=new Image(); im.onload=function(){res({im:im,url:url});}; im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('تعذّر قراءة الصورة'));}; im.src=url; }); }
function scaled(im,max,q){ var w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,max/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s); var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); }
function processImageFile(file){
  var ok=['image/jpeg','image/png','image/webp'];
  if(ok.indexOf(file.type)<0) return Promise.reject(new Error('الصيغ المدعومة: JPG وPNG وWebP'));
  if(file.size>25*1024*1024) return Promise.reject(new Error('حجم الصورة يتجاوز 25 ميغابايت'));
  return loadImage(file).then(function(r){ var o={full:scaled(r.im,2000,0.9),thumb:scaled(r.im,560,0.82)}; URL.revokeObjectURL(r.url); return o; });
}

function readClient(fd){
  var name=(fd.get('name')||'').trim(); if(!name) throw new Error('اسم العميل مطلوب');
  var email=(fd.get('email')||'').trim(); if(email&&!/^\S+@\S+\.\S+$/.test(email)) throw new Error('البريد الإلكتروني غير صالح');
  var cur=fd.get('currency'); var p=Number(fd.get('price')||0); if(!isFinite(p)||p<0) throw new Error('السعر غير صالح');
  return {name:name,contact:(fd.get('contact')||'').trim(),email:email,phone:(fd.get('phone')||'').trim(),notes:(fd.get('notes')||'').trim(),currency:cur,defaultPrice:toMinor(p,cur)};
}
function openClient(id){

    save(); render(); toast('تم الحفظ'); }});
}

  var CAR=/كاروسيل|كروسيل|carousel/i;

  var cid=d?d.clientId:(presetClient||(UI.df.client)||S.clients.filter(function(c){return !c.archived;})[0].id);
  var c0=clientById(cid); var cur0=d?d.currency:c0.currency; var cat0=d?d.category||'':'';
  var price0=d?d.price:defaultPriceFor(cid,cat0,cur0);
  var html='<div class="field"><label>العميل *</label><select name="client" id="fclient">'+clientOptions(cid,false,true)+'</select></div>'+
   '<div class="field"><label>اسم التصميم *</label><input name="title" required value="'+esc(d?d.title:'')+'"></div>'+

   '<div class="two"><div class="field"><label>العملة</label><select name="currency" id="fcur">'+currencyOptions(cur0)+'</select></div><div class="field"><label>السعر *</label><input type="number" name="price" id="fprice" step="any" min="0" required value="'+fromMinor(price0,cur0)+'"></div></div>'+
   '<div class="two" id="fslides" style="display:none"><div class="field"><label>سعر الشريحة الواحدة</label><input type="number" name="slidePrice" id="fsp" step="any" min="0" value="'+(d&&d.slides?fromMinor(d.slidePrice,cur0):(d?fromMinor(price0,cur0):0))+'"></div><div class="field"><label>عدد الشرائح</label><input type="number" name="slideCount" id="fsc" step="1" min="1" value="'+(d&&d.slides?d.slides:1)+'"></div></div>'+
   '<div class="field"><label>وصف</label><textarea name="description">'+esc(d?d.description||'':'')+'</textarea></div><div class="field"><label>ملاحظات داخلية</label><input name="notes" value="'+esc(d?d.notes||'':'')+'"></div>'+
   (d&&invoicedDesignIds()[d.id]?'<div class="notice">هذا التصميم موجود في فاتورة؛ تعديل سعره هنا لا يغيّر الفاتورة.</div>':'');
  var pending=null;
  modal({title:d?'تعديل التصميم':'تصميم جديد',html:html,onMount:function(f){
    var dirty=!!d; var dirtyS=!!d; var price=$('fprice');
    function isCar(){ return CAR.test($('fcat').value); }
    function calc(){ var cu=$('fcur').value; var per=Number($('fsp').value)||0; var n=Math.max(1,Math.floor(Number($('fsc').value)||1)); price.value=fromMinor(toMinor(per,cu)*n,cu); }
    function sync(){ var car=isCar(); $('fslides').style.display=car?'':'none'; price.readOnly=car; if(car) calc(); }
    price.addEventListener('input',function(){dirty=true;});
    $('fsp').addEventListener('input',function(){ dirtyS=true; calc(); });
    $('fsc').addEventListener('input',calc);
    function autofill(newCur){
      var cl=$('fclient').value; var cu=$('fcur').value;
      if(isCar()){ if(newCur){ var c1=clientById(cl); if(c1){ $('fcur').value=c1.currency; cu=c1.currency; } } if(!dirtyS) $('fsp').value=fromMinor(defaultPriceFor(cl,$('fcat').value.trim(),cu),cu); sync(); return; }
      if(dirty) return; if(newCur){ var c=clientById(cl); if(c) { $('fcur').value=c.currency; cu=c.currency; } } price.value=fromMinor(defaultPriceFor(cl,$('fcat').value.trim(),cu),cu); }
    $('fclient').addEventListener('change',function(){ autofill(true); });
    $('fcat').addEventListener('input',function(){ autofill(false); sync(); });
    $('fcur').addEventListener('change',function(){ dirty=false; dirtyS=false; autofill(false); });
    sync();
    $('fimg').addEventListener('change',function(){ var file=this.files[0]; pending=null; $('fprev').style.display='none'; if(!file) return;
      processImageFile(file).then(function(o){ pending=o; $('fprev').src=o.thumb; $('fprev').style.display='block'; }).catch(function(e){ var el=$('merr'); el.textContent=e.message; el.hidden=false; $('fimg').value=''; }); });
  },onSubmit:function(fd,f){
    var title=(fd.get('title')||'').trim(); if(!title) throw new Error('اسم التصميم مطلوب');
    var date=fd.get('date'); if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')) throw new Error('تاريخ التسليم مطلوب');
    var cur=fd.get('currency'); var pv=Number(fd.get('price')); if(fd.get('price')===''||!isFinite(pv)||pv<0) throw new Error('السعر غير صالح');
    var file=f.querySelector('#fimg').files[0];
    if(!d&&!file) throw new Error('صورة التصميم مطلوبة');
    if(file&&!pending) throw new Error('جارٍ معالجة الصورة… حاول بعد لحظة');
    var rec=d||{id:uid(),createdAt:new Date().toISOString()};
    rec.clientId=fd.get('client'); rec.title=title; rec.date=date; rec.category=(fd.get('category')||'').trim(); rec.currency=cur; rec.price=toMinor(pv,cur);
    if(CAR.test(rec.category)){ var sc=Math.floor(Number(fd.get('slideCount'))); var sp=Number(fd.get('slidePrice')); if(!(sc>=1)) throw new Error('عدد الشرائح غير صالح'); if(fd.get('slidePrice')===''||!isFinite(sp)||sp<0) throw new Error('سعر الشريحة غير صالح'); rec.slides=sc; rec.slidePrice=toMinor(sp,cur); rec.price=rec.slidePrice*sc; } else { delete rec.slides; delete rec.slidePrice; }
    rec.description=(fd.get('description')||'').trim(); rec.notes=(fd.get('notes')||'').trim();
    var old=d?d.imageId:null;
    if(pending){ var nid=uid(); putImage(nid,pending); rec.imageId=nid; }
    if(!d) S.designs.push(rec);
    if(old&&old!==rec.imageId) dropImageIfUnused(old);
    save(); render(); toast('تم حفظ التصميم'); }});
}

    ['imo','iyr','icu'].forEach(function(i){ $(i).addEventListener('change',pre); }); pre();
  },onSubmit:function(fd){
    var cur=fd.get('currency'); var adjN=Number(fd.get('adj')||0); if(!isFinite(adjN)) throw new Error('قيمة الخصم غير صالحة');
    var adj=Math.round(adjN*Math.pow(10,CUR[cur].d));
    var ids=fd.getAll('d'); if(!ids.length) throw new Error('اختر تصميماً واحداً على الأقل');
    var inv=buildInvoice(fd.get('client'),+fd.get('year'),+fd.get('month'),cur,adj,(fd.get('notes')||'').trim(),null,ids);
    S.invoices.push(inv); save(); location.hash='#/invoices/'+inv.id; toast('تم إنشاء المسودة'); }});
}

function openInvoiceEdit(id){
  var inv=invById(id); var cur=inv.currency; var fin=inv.state==='finalized';
  var rows=inv.items.map(function(it,i){
    var price=it.slides?'<div class="two" style="margin-top:6px"><div><label style="font-size:12px" class="muted">سعر الشريحة</label><input type="number" step="any" min="0" name="isp'+i+'" value="'+fromMinor(it.slidePrice,cur)+'"></div><div><label style="font-size:12px" class="muted">عدد الشرائح</label><input type="number" step="1" min="1" name="isc'+i+'" value="'+it.slides+'"></div></div>'
      :'<div style="margin-top:6px"><label style="font-size:12px" class="muted">السعر</label><input type="number" step="any" min="0" name="ip'+i+'" value="'+fromMinor(it.price,cur)+'"></div>';
    return '<div style="padding:10px 12px;border-bottom:1px solid var(--line)"><div class="row" style="gap:8px;align-items:center"><input name="it'+i+'" value="'+esc(it.title)+'" style="flex:1" aria-label="اسم التصميم"><label style="display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px;color:var(--bad)"><input type="checkbox" name="rm'+i+'" style="width:auto">حذف</label></div>'+price+'</div>'; }).join('');
  modal({title:'تعديل الفاتورة '+inv.number,wide:true,html:
    (fin?'<div class="notice">الفاتورة معتمدة؛ أي تعديل هنا يغيّر المبالغ المسجّلة عليها. المدفوعات الحالية تبقى كما هي.</div>':'')+
    '<div class="field"><label>البنود</label><div style="border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto">'+rows+'</div></div>'+
    '<div class="two"><div class="field"><label>خصم (−) أو إضافة (+)</label><input name="adj" type="number" step="any" value="'+fromMinor(inv.adjustment,cur)+'"></div><div class="field"><label>تاريخ الإصدار</label><input type="date" name="issue" value="'+inv.issueDate+'"></div></div>'+
    '<div class="field"><label>ملاحظات</label><textarea name="notes">'+esc(inv.notes)+'</textarea></div><div class="field"><label>تعليمات الدفع</label><textarea name="pay">'+esc(inv.payInstr)+'</textarea></div><div class="field"><label>رسالة الختام</label><textarea name="closing">'+esc(inv.closing)+'</textarea></div>',
  onSubmit:function(fd){
    var a=Number(fd.get('adj')||0); if(!isFinite(a)) throw new Error('قيمة غير صالحة'); var adj=Math.round(a*Math.pow(10,CUR[cur].d));
    var items=[];
    inv.items.forEach(function(it,i){
      if(fd.get('rm'+i)) return;
      var n=JSON.parse(JSON.stringify(it)); var t=(fd.get('it'+i)||'').trim(); if(!t) throw new Error('اسم التصميم مطلوب');
      n.title=t;
      if(it.slides){ var sc=Math.floor(Number(fd.get('isc'+i))), sp=Number(fd.get('isp'+i)); if(!(sc>=1)) throw new Error('عدد الشرائح غير صالح'); if(!isFinite(sp)||sp<0) throw new Error('سعر الشريحة غير صالح'); n.slides=sc; n.slidePrice=toMinor(sp,cur); n.price=n.slidePrice*sc; }
      else { var pv=Number(fd.get('ip'+i)); if(fd.get('ip'+i)===''||!isFinite(pv)||pv<0) throw new Error('السعر غير صالح'); n.price=toMinor(pv,cur); }
      items.push(n); });
    if(!items.length) throw new Error('يجب أن تحتوي الفاتورة على بند واحد على الأقل');
    var tt=invoiceTotals(items.map(function(i){return i.price;}),adj);
    if(fin&&tt.total<invPaid(inv)) throw new Error('الإجمالي الجديد أقل من المدفوع ('+fmt(invPaid(inv),cur)+')');
    var gone=inv.items.filter(function(o){return !items.some(function(n){return n.designId===o.designId;});});
    inv.items=items; inv.adjustment=adj; inv.subtotal=tt.subtotal; inv.total=tt.total; inv.issueDate=fd.get('issue')||inv.issueDate; inv.notes=(fd.get('notes')||'').trim(); inv.payInstr=(fd.get('pay')||'').trim(); inv.closing=(fd.get('closing')||'').trim();
    gone.forEach(function(g){ dropImageIfUnused(g.imageId); });
    save(); render(); toast('تم تعديل الفاتورة'); }});
}

function openPayment(id){
  var inv=invById(id); var inf=invInfo(inv);
  modal({title:'تسجيل دفعة — '+inv.number,html:'<div class="notice">المتبقي: '+esc(fmt(inf.remaining,inv.currency))+' ('+inv.currency+')</div><div class="two"><div class="field"><label>المبلغ *</label><input name="amount" type="number" step="any" min="0" value="'+fromMinor(inf.remaining,inv.currency)+'"></div><div class="field"><label>تاريخ الدفع</label><input name="date" type="date" value="'+today()+'"></div></div><div class="field"><label>طريقة الدفع</label><input name="method" placeholder="تحويل، نقداً…"></div><div class="field"><label>ملاحظات</label><input name="notes"></div>',onSubmit:function(fd){
    var a=Number(fd.get('amount')); if(!isFinite(a)||a<=0) throw new Error('أدخل مبلغاً أكبر من صفر'); var minor=toMinor(a,inv.currency);
    if(minor>invInfo(inv).remaining) throw new Error('المبلغ يتجاوز المتبقي على الفاتورة');
    S.payments.push({id:uid(),invoiceId:inv.id,amount:minor,date:fd.get('date')||today(),method:(fd.get('method')||'').trim(),notes:(fd.get('notes')||'').trim()});
    save(); render(); toast('تم تسجيل الدفعة'); }});
}

  dview:function(v){ UI.dview=v; render(); },
  dcur:function(v){ UI.dash.cur=v; render(); },
  zoom:function(id){ lightbox(id); },
  newInvoice:function(id){ openInvoiceCreate(id); },
  editInvoice:function(id){ openInvoiceEdit(id); },
  refreshInvoice:function(id){ var inv=invById(id); var ds=eligibleDesigns(inv.clientId,inv.year,inv.month,inv.currency,inv.id); if(!ds.length){ toast('لا توجد تصاميم',true); return; }
    var cur=inv.items.reduce(function(o,i){o[i.designId]=1;return o;},{});
    modal({title:'اختيار التصاميم — '+inv.number,submit:'تحديث الفاتورة',html:'<div id="ilist"></div><div class="notice" id="ipre" style="margin-top:12px"></div>',onSubmit:function(fd){
      var picked=fd.getAll('d'); if(!picked.length) throw new Error('اختر تصميماً واحداً على الأقل');
      inv.items=itemsFromDesigns(ds.filter(function(d){return picked.indexOf(d.id)>=0;})); var t=invoiceTotals(inv.items.map(function(i){return i.price;}),inv.adjustment); inv.subtotal=t.subtotal; inv.total=t.total; save(); render(); toast('تم تحديث البنود'); }});
    $('ilist').innerHTML=designPickList(ds,function(d){return !!cur[d.id];},inv.currency); wirePick($('ilist'),$('ipre'),inv.currency); },
  finalize:function(id){ var inv=invById(id); confirmBox('اعتماد الفاتورة '+inv.number+'؟ ستُحفظ كنسخة ثابتة ولن يمكن تعديل بنودها أو مبالغها.','اعتماد').then(function(ok){ if(!ok) return;
    inv.clientSnap=clientSnap(clientById(inv.clientId)||inv.clientSnap); inv.state='finalized'; inv.finalizedAt=new Date().toISOString(); save(); render(); toast('تم اعتماد الفاتورة'); }); },
  delInvoice:function(id){ confirmBox('حذف هذه المسودة نهائياً؟','حذف',true).then(function(ok){ if(!ok) return; var inv=invById(id); S.invoices=S.invoices.filter(function(i){return i.id!==id;}); inv.items.forEach(function(it){dropImageIfUnused(it.imageId);}); save(); location.hash='#/invoices'; toast('تم الحذف'); }); },
  voidInvoice:function(id){ var inv=invById(id);
    if(S.payments.some(function(p){return p.invoiceId===id;})){ toast('احذف الدفعات المسجّلة أولاً ثم ألغِ الفاتورة',true); return; }
    confirmBox('سيتم إلغاء '+inv.number+' (تبقى محفوظة كسجل) وإنشاء مسودة بديلة من التصاميم الحالية. متابعة؟','إلغاء واستبدال',true).then(function(ok){ if(!ok) return;
      inv.state='void'; var nw; try{ nw=buildInvoice(inv.clientId,inv.year,inv.month,inv.currency,inv.adjustment,inv.notes,inv.id,inv.items.map(function(i){return i.designId;})); }catch(e){ inv.state='finalized'; toast(e.message,true); return; }
      S.invoices.push(nw); save(); location.hash='#/invoices/'+nw.id; toast('تم إنشاء مسودة بديلة'); }); },
  print:function(){ window.print(); },
  addPayment:function(id){ openPayment(id); },
  delPayment:function(id){ confirmBox('حذف هذه الدفعة؟ سيُعاد احتساب المتبقي.','حذف',true).then(function(ok){ if(!ok) return; S.payments=S.payments.filter(function(p){return p.id!==id;}); save(); render(); }); },
  addCat:function(){ modal({title:'فئة جديدة',html:'<div class="field"><label>اسم الفئة</label><input name="name" required></div><div class="two"><div class="field"><label>العملة</label><select name="currency">'+currencyOptions(S.settings.defaultCurrency)+'</select></div><div class="field"><label>السعر الافتراضي</label><input name="price" type="number" step="any" min="0" value="0"></div></div>',onSubmit:function(fd){
    var n=(fd.get('name')||'').trim(); if(!n) throw new Error('الاسم مطلوب'); var cu=fd.get('currency'); var p=Number(fd.get('price')); if(!isFinite(p)||p<0) throw new Error('سعر غير صالح');
    S.settings.categories.push({name:n,currency:cu,price:toMinor(p,cu)}); save(); render(); }}); },
  delCat:function(i){ S.settings.categories.splice(+i,1); save(); render(); },
  export:function(){ var data={app:'abdulrahman-visuals',version:1,exportedAt:new Date().toISOString(),state:S,images:IMG};
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download='av-backup-'+today()+'.json'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000); },
  import:function(){ var f=$('impf'); f.value=''; f.onchange=function(){ var file=f.files[0]; if(!file) return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(d.app!=='abdulrahman-visuals'||!d.state) throw new Error('ملف غير صالح');

    }catch(e){ toast(e.message||'تعذّر قراءة الملف',true); } }; r.readAsText(file); }; f.click(); }
};

/* ---------- Render / router ---------- */
function render(){
  var parts=(location.hash||'#/dashboard').replace(/^#\/?/,'').split('/'); var r=parts[0]||'dashboard'; UI.route=parts.join('/');
  var inner;
  if(r==='dashboard') inner=viewDashboard(); else if(r==='clients') inner=parts[1]?viewClient(parts[1]):viewClients(); else if(r==='designs') inner=viewDesigns();
  else if(r==='invoices') inner=parts[1]?viewInvoice(parts[1]):viewInvoices(); else if(r==='payments') inner=viewPayments(); else if(r==='settings') inner=viewSettings(); else inner=viewDashboard();
  var ae=document.activeElement, aid=ae&&ae.id, pos=ae&&ae.selectionStart;
  var sx=window.scrollX, sy=window.scrollY;
  $('app').innerHTML=layout(inner);
  window.scrollTo(sx,sy);
  if(aid&&$(aid)){ $(aid).focus(); try{ if(pos!=null) $(aid).setSelectionRange(pos,pos); }catch(e){} }
  document.title=(S.settings.designerName||'Abdulrahman Ramadan')+' — إدارة الفواتير';
  fitSheet(); Array.prototype.forEach.call(document.querySelectorAll('#sheet img'),function(im){ if(!im.complete) im.addEventListener('load',fitSheet); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitSheet);
}
function bind(){
  document.addEventListener('click',function(e){ var el=e.target.closest('[data-act]'); if(!el) return; var fn=ACTIONS[el.getAttribute('data-act')]; if(fn){ e.preventDefault(); fn(el.getAttribute('data-id')); } });
  document.addEventListener('click',function(e){ if(e.target.closest('[data-nav]')){ var sb=$('sidebar'); if(sb) sb.classList.remove('open'); } });
  var map={ dm:function(v){UI.dash.m=+v;}, dy:function(v){UI.dash.y=+v;}, cq:function(v){UI.cf.q=v;}, cpy:function(v){UI.cp.y=v;}, cpm:function(v){UI.cp.m=v;}, cpc:function(v){UI.cp.cat=v;}, cpi:function(v){UI.cp.inv=v;},
    dq:function(v){UI.df.q=v;}, dfc:function(v){UI.df.client=v;}, dfy:function(v){UI.df.y=v;}, dfm:function(v){UI.df.m=v;}, dfk:function(v){UI.df.cat=v;},
    iq:function(v){UI.iv.q=v;}, ifc:function(v){UI.iv.client=v;}, ify:function(v){UI.iv.y=v;}, ifm:function(v){UI.iv.m=v;} };
  function h(e){ var t=e.target; if(t.id&&map[t.id]&&!t.closest('#layer')){ map[t.id](t.value); render(); } }
  document.addEventListener('input',function(e){ if(e.target.tagName==='INPUT') h(e); });
  document.addEventListener('change',function(e){ if(e.target.tagName==='SELECT') h(e); });
  document.addEventListener('submit',function(e){ if(e.target.id==='sform'){ e.preventDefault(); var fd=new FormData(e.target); var s=S.settings; var err=$('serr');
      var url=(fd.get('portfolioUrl')||'').trim(); if(url&&!safeUrl(url)){ err.textContent='رابط المعرض غير صالح'; err.hidden=false; return; }
      var seq=parseInt(fd.get('seq'),10); if(!(seq>=1)){ err.textContent='الرقم التسلسلي غير صالح'; err.hidden=false; return; }
      var prefix=(fd.get('prefix')||'').trim().replace(/[^A-Za-z0-9]/g,''); if(!prefix){ err.textContent='البادئة مطلوبة'; err.hidden=false; return; }
      s.designerName=(fd.get('designerName')||'').trim()||'Abdulrahman Ramadan'; s.designerNameAr=(fd.get('designerNameAr')||'').trim()||s.designerNameAr;
      s.portfolioUrl=url||PORTFOLIO_DEFAULT; s.defaultCurrency=fd.get('defaultCurrency'); s.prefix=prefix; s.seq=seq; s.email=(fd.get('email')||'').trim(); s.phone=(fd.get('phone')||'').trim();
      s.notes=(fd.get('notes')||'').trim(); s.payInstr=(fd.get('payInstr')||'').trim(); s.closing=(fd.get('closing')||'').trim(); save(); render(); toast('تم حفظ الإعدادات'); } });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
  window.addEventListener('hashchange',function(){ closeModal(); render(); window.scrollTo(0,0); });
  var wasMob=isMobile(), rt=null;
  window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ var m=isMobile(); if(m!==wasMob){ wasMob=m; render(); } else fitSheet(); },120); });
}
function init(){
  idbOpen().then(function(db){ idb=db; return Promise.all([idbGet('kv','state'),idbAll('img')]); }).then(function(r){
    if(r[0]){ S=Object.assign(defaultState(),r[0]); S.settings=Object.assign(defaultState().settings,r[0].settings); delete S.settings.brandName; } IMG=r[1]||{};
  }).catch(function(){ memoryOnly=true; }).then(function(){ bind(); render(); });
}
if(typeof document!=='undefined'){ init(); }
